<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Performance Dashboard | TPJG</title>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2A4A; --gold: #C9A84C; --cream: #C7C1BA; --white: #FFF;
  --light: #F8F6F3; --text: #2D2D2D; --green: #27ae60; --blue: #3498db;
  --red: #e74c3c; --orange: #f39c12;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Karla',sans-serif; color:var(--text); background:var(--light); }
h1,h2,h3 { font-family:'Alice',serif; color:var(--navy); }
.topnav { background:var(--navy); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
.topnav .brand { font-family:'Alice',serif; color:var(--gold); font-size:1.2rem; }
.topnav .nav-links a { color:var(--cream); text-decoration:none; font-size:0.9rem; margin-left:16px; }
.container { max-width:1200px; margin:0 auto; padding:24px; }
.hero-bar { background:linear-gradient(135deg,var(--navy),#2C3E6B); color:white; padding:24px; border-radius:12px; margin-bottom:24px; }
.hero-bar h1 { color:var(--gold); font-size:1.6rem; margin-bottom:8px; }
.hero-bar .subtitle { color:var(--cream); font-size:0.95rem; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.kpi { background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; }
.kpi .number { font-size:2.2rem; font-weight:700; color:var(--navy); font-family:'Alice',serif; }
.kpi .label { font-size:0.8rem; color:#888; text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
.kpi .trend { font-size:0.85rem; margin-top:6px; }
.kpi .trend.up { color:var(--green); }
.kpi .trend.down { color:var(--red); }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
@media(max-width:768px) { .grid-2 { grid-template-columns:1fr; } }
.card { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.card h3 { font-size:1.1rem; margin-bottom:16px; }
table { width:100%; border-collapse:collapse; font-size:0.9rem; }
th { text-align:left; padding:8px 12px; background:var(--light); color:var(--navy); font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; }
td { padding:8px 12px; border-bottom:1px solid #f0f0f0; }
tr:hover { background:#fafafa; }
.rank-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-weight:700; font-size:0.75rem; }
.rank-badge.a-plus { background:var(--navy); color:var(--gold); }
.rank-badge.a { background:#e8f5e9; color:#2e7d32; }
.rank-badge.b { background:#e3f2fd; color:#1565c0; }
.rank-badge.c { background:#fff3e0; color:#e65100; }
.bar-container { width:100%; height:20px; background:#f0f0f0; border-radius:10px; overflow:hidden; }
.bar-fill { height:100%; border-radius:10px; transition:width 0.5s; }
.bar-fill.navy { background:var(--navy); }
.bar-fill.gold { background:var(--gold); }
.bar-fill.green { background:var(--green); }
.bar-fill.blue { background:var(--blue); }
.stat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f5f5f5; font-size:0.9rem; }
.stat-row:last-child { border-bottom:none; }
#loading { text-align:center; padding:40px; font-size:1.1rem; color:var(--navy); }
</style>
</head>
<body>
<nav class="topnav">
  <span class="brand">TPJG Team Dashboard</span>
  <div class="nav-links">
    <a href="../contact360/">Contact 360</a>
    <a href="../icosa/">Icosa</a>
  </div>
</nav>

<div class="container">
  <div class="hero-bar">
    <h1>Team Performance Dashboard</h1>
    <div class="subtitle" id="lastUpdated">Loading data...</div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="grid-2">
    <div class="card">
      <h3>CRM Contact Distribution</h3>
      <div id="sortBreakdown"></div>
    </div>
    <div class="card">
      <h3>Recent AI Activities</h3>
      <div id="recentActivities"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <h3>Team Engagement Leaderboard</h3>
    <table id="teamTable">
      <thead>
        <tr><th>Agent</th><th>Rank</th><th>Texts</th><th>Meetings</th><th>Touchpoints</th><th>Engagement</th></tr>
      </thead>
      <tbody id="teamBody"></tbody>
    </table>
  </div>

  <div class="grid-2">
    <div class="card">
      <h3>Data Source Coverage</h3>
      <div id="sourceCoverage"></div>
    </div>
    <div class="card">
      <h3>Knowledge Base Status</h3>
      <div id="kbStatus"></div>
    </div>
  </div>
</div>

<script>
async function loadDashboard() {
  try {
    // Load CRM data
    const crmResp = await fetch('./crm-summary.json');
    const crm = await crmResp.json();

    // Load team data
    const teamResp = await fetch('./team-data.json');
    const team = await teamResp.json();

    renderKPIs(crm, team);
    renderSortBreakdown(crm.sort_breakdown);
    renderActivities(crm.recent_activities_logged);
    renderTeamTable(team);
    renderSourceCoverage(crm);
    renderKBStatus(crm);

    document.getElementById('lastUpdated').textContent =
      `Data as of ${crm.generated || 'unknown'} | ${crm.summary?.total_unique_contacts || 0} contacts | ${team.length} team agents`;
  } catch(e) {
    document.getElementById('lastUpdated').textContent = 'Error loading data. Ensure JSON files are present.';
    console.error(e);
  }
}

function renderKPIs(crm, team) {
  const kpis = [
    { number: crm.summary?.total_unique_contacts || 0, label: 'Total Contacts', trend: '' },
    { number: team.length, label: 'Team Agents', trend: '' },
    { number: crm.sort_breakdown?.['A+'] || 0, label: 'A+ Contacts', trend: '' },
    { number: crm.recent_activities_logged?.total_activities_logged || 0, label: 'Recent AI Activities', trend: '' },
    { number: crm.summary?.contacts_with_phone || 0, label: 'With Phone', trend: '' },
    { number: crm.summary?.contacts_with_email || 0, label: 'With Email', trend: '' },
  ];

  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="number">${k.number.toLocaleString()}</div>
      <div class="label">${k.label}</div>
      ${k.trend ? `<div class="trend ${k.trend.startsWith('+') ? 'up' : 'down'}">${k.trend}</div>` : ''}
    </div>
  `).join('');
}

function renderSortBreakdown(breakdown) {
  if (!breakdown) return;
  const total = Object.values(breakdown).reduce((a,b)=>a+b, 0);
  const colors = { 'A+': 'navy', 'A': 'green', 'B': 'blue', 'C': 'gold', 'D': '#95a5a6' };

  document.getElementById('sortBreakdown').innerHTML = Object.entries(breakdown)
    .filter(([k,v]) => v > 0)
    .map(([rank, count]) => {
      const pct = Math.round((count/total)*100);
      const color = colors[rank] || '#ddd';
      return `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:4px;">
            <span><strong>${rank}</strong></span>
            <span>${count} (${pct}%)</span>
          </div>
          <div class="bar-container">
            <div class="bar-fill" style="width:${pct}%;background:${color};"></div>
          </div>
        </div>
      `;
    }).join('');
}

function renderActivities(activities) {
  if (!activities) { document.getElementById('recentActivities').innerHTML = '<p>No recent activities</p>'; return; }
  document.getElementById('recentActivities').innerHTML = `
    <div class="stat-row"><span>Total Logged</span><strong>${activities.total_activities_logged}</strong></div>
    <div class="stat-row"><span>Batch 1</span><strong>${activities.batch_1_contacts} contacts (${activities.batch_1_date})</strong></div>
    <div class="stat-row"><span>Batch 2</span><strong>${activities.batch_2_contacts} contacts (${activities.batch_2_date})</strong></div>
    <div class="stat-row"><span>Activity Type</span><strong>${activities.activity_type}</strong></div>
    <div class="stat-row"><span>Subject</span><strong>${activities.batch_1_subject}</strong></div>
  `;
}

function renderTeamTable(team) {
  const maxTP = Math.max(...team.map(t => t.touchpoints));
  document.getElementById('teamBody').innerHTML = team.slice(0, 25).map(t => {
    const pct = Math.round((t.touchpoints/maxTP)*100);
    const rc = t.rank === 'A+' ? 'a-plus' : t.rank === 'A' ? 'a' : t.rank === 'B' ? 'b' : 'c';
    return `<tr>
      <td><strong>${t.name}</strong></td>
      <td><span class="rank-badge ${rc}">${t.rank}</span></td>
      <td>${t.texts.toLocaleString()}</td>
      <td>${t.meetings}</td>
      <td>${t.touchpoints.toLocaleString()}</td>
      <td><div class="bar-container" style="width:120px;display:inline-block;">
        <div class="bar-fill gold" style="width:${pct}%;"></div>
      </div></td>
    </tr>`;
  }).join('');
}

function renderSourceCoverage(crm) {
  const sources = [
    { name: 'CRM Contacts', count: crm.summary?.total_unique_contacts || 0 },
    { name: 'With Phone', count: crm.summary?.contacts_with_phone || 0 },
    { name: 'With Email', count: crm.summary?.contacts_with_email || 0 },
    { name: 'Total Groups', count: crm.total_groups_in_rm || 0 },
  ];
  document.getElementById('sourceCoverage').innerHTML = sources.map(s =>
    `<div class="stat-row"><span>${s.name}</span><strong>${s.count.toLocaleString()}</strong></div>`
  ).join('');
}

function renderKBStatus(crm) {
  document.getElementById('kbStatus').innerHTML = `
    <div class="stat-row"><span>Source</span><strong>${crm.source || 'N/A'}</strong></div>
    <div class="stat-row"><span>Freshness</span><strong>${crm.data_freshness || 'N/A'}</strong></div>
    <div class="stat-row"><span>Generated</span><strong>${crm.generated || 'N/A'}</strong></div>
    <div class="stat-row"><span>AI Activities</span><strong>${crm.contacts_created_by_ai || 0} contacts created by AI</strong></div>
  `;
}

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
