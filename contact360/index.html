<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact 360 View | TPJG</title>
<meta name="description" content="Unified contact view across CRM, texts, meetings, drive files, and email.">
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2A4A;
  --gold: #C9A84C;
  --cream: #C7C1BA;
  --white: #FFFFFF;
  --light-bg: #F8F6F3;
  --text: #2D2D2D;
  --green: #27ae60;
  --red: #e74c3c;
  --blue: #3498db;
  --orange: #f39c12;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Karla',sans-serif; color:var(--text); background:var(--light-bg); line-height:1.6; }
h1,h2,h3,h4 { font-family:'Alice',serif; color:var(--navy); }

.topnav {
  background:var(--navy); padding:12px 24px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:100;
}
.topnav .brand { font-family:'Alice',serif; color:var(--gold); font-size:1.2rem; }
.topnav .nav-links { display:flex; gap:16px; }
.topnav a { color:var(--cream); text-decoration:none; font-size:0.9rem; }
.topnav a:hover { color:var(--gold); }

.search-section {
  background: linear-gradient(135deg, var(--navy) 0%, #2C3E6B 100%);
  padding: 40px 24px; text-align:center;
}
.search-section h1 { color:var(--gold); font-size:2rem; margin-bottom:16px; }
.search-section p { color:var(--cream); margin-bottom:20px; }
.search-box {
  max-width:600px; margin:0 auto; display:flex; gap:8px;
}
.search-box input {
  flex:1; padding:14px 20px; border:2px solid var(--gold); border-radius:8px;
  font-size:1.1rem; font-family:'Karla',sans-serif; background:white;
  outline:none;
}
.search-box input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,0.2); }
.search-box button {
  padding:14px 28px; background:var(--gold); color:var(--navy); border:none;
  border-radius:8px; font-weight:700; font-size:1rem; cursor:pointer;
  font-family:'Karla',sans-serif;
}
.search-box button:hover { background:#d4b35a; }
.search-stats {
  color:var(--cream); font-size:0.85rem; margin-top:12px; opacity:0.8;
}
.search-results {
  max-width:600px; margin:8px auto 0; background:white; border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.15); display:none; max-height:300px;
  overflow-y:auto; text-align:left;
}
.search-results.active { display:block; }
.search-result-item {
  padding:12px 20px; cursor:pointer; border-bottom:1px solid #eee;
  display:flex; justify-content:space-between; align-items:center;
}
.search-result-item:hover { background:var(--light-bg); }
.search-result-item .name { font-weight:600; color:var(--navy); }
.search-result-item .meta { font-size:0.8rem; color:#888; }
.search-result-item .sources {
  display:flex; gap:4px;
}
.source-badge {
  font-size:0.65rem; padding:2px 6px; border-radius:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.5px;
}
.source-badge.crm { background:#e8f5e9; color:#2e7d32; }
.source-badge.text { background:#e3f2fd; color:#1565c0; }
.source-badge.transcript { background:#fff3e0; color:#e65100; }
.source-badge.drive { background:#f3e5f5; color:#7b1fa2; }
.source-badge.email { background:#fce4ec; color:#c62828; }

.contact-view { display:none; max-width:1100px; margin:0 auto; padding:24px; }
.contact-view.active { display:block; }

.contact-header {
  background:white; border-radius:12px; padding:28px; margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06); display:flex; align-items:flex-start;
  gap:24px;
}
.contact-avatar {
  width:80px; height:80px; border-radius:50%; background:var(--navy);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'Alice',serif; font-size:2rem; color:var(--gold);
}
.contact-info { flex:1; }
.contact-info h2 { font-size:1.8rem; margin-bottom:4px; }
.contact-info .subtitle { color:#666; font-size:0.95rem; margin-bottom:12px; }
.contact-meta { display:flex; gap:16px; flex-wrap:wrap; }
.contact-meta-item {
  display:flex; align-items:center; gap:6px; font-size:0.9rem;
}
.contact-meta-item .icon { font-size:1.1rem; }
.back-btn {
  padding:8px 16px; background:var(--light-bg); border:1px solid #ddd;
  border-radius:6px; cursor:pointer; font-family:'Karla',sans-serif;
  font-size:0.9rem; color:var(--navy); margin-left:auto; flex-shrink:0;
}
.back-btn:hover { background:#eee; }

.rank-badge {
  display:inline-block; padding:4px 12px; border-radius:12px;
  font-weight:700; font-size:0.85rem; margin-right:8px;
}
.rank-badge.a-plus { background:#1B2A4A; color:var(--gold); }
.rank-badge.a { background:#27ae60; color:white; }
.rank-badge.b { background:#3498db; color:white; }
.rank-badge.c { background:#f39c12; color:white; }
.rank-badge.d { background:#95a5a6; color:white; }
.rank-badge.unranked { background:#ecf0f1; color:#7f8c8d; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px; }
@media (max-width:768px) {
  .grid-2, .grid-3 { grid-template-columns:1fr; }
  .contact-header { flex-direction:column; }
}

.card {
  background:white; border-radius:12px; padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.card h3 { font-size:1.1rem; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card h3 .icon { font-size:1.3rem; }

.stat-row {
  display:flex; justify-content:space-between; padding:8px 0;
  border-bottom:1px solid #f0f0f0; font-size:0.9rem;
}
.stat-row:last-child { border-bottom:none; }
.stat-label { color:#666; }
.stat-value { font-weight:600; color:var(--navy); }

.tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.8rem;
  background:var(--light-bg); color:var(--navy); margin:2px; font-weight:500; }

.topic-bar {
  display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.85rem;
}
.topic-bar .label { width:80px; text-align:right; color:#666; flex-shrink:0; }
.topic-bar .bar-bg {
  flex:1; height:20px; background:#f0f0f0; border-radius:10px; overflow:hidden;
}
.topic-bar .bar-fill {
  height:100%; border-radius:10px; background:var(--gold);
  display:flex; align-items:center; padding-left:8px;
  font-size:0.75rem; font-weight:600; color:var(--navy); min-width:30px;
}

.file-list { list-style:none; }
.file-list li {
  padding:8px 12px; border-bottom:1px solid #f5f5f5;
  font-size:0.85rem; display:flex; align-items:center; gap:8px;
}
.file-list li:last-child { border-bottom:none; }
.file-list .file-icon { font-size:1.1rem; }
.file-list .file-cat {
  font-size:0.7rem; padding:2px 6px; border-radius:8px;
  background:var(--light-bg); color:var(--navy); font-weight:600;
  text-transform:uppercase;
}

.meeting-item {
  padding:10px 0; border-bottom:1px solid #f0f0f0; font-size:0.9rem;
}
.meeting-item:last-child { border-bottom:none; }
.meeting-topic { font-weight:600; color:var(--navy); }

.tier-indicator {
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
  border-radius:20px; font-weight:600; font-size:0.85rem;
}
.tier-indicator.daily { background:#e8f5e9; color:#2e7d32; }
.tier-indicator.weekly { background:#e3f2fd; color:#1565c0; }
.tier-indicator.monthly { background:#fff3e0; color:#e65100; }
.tier-indicator.quarterly { background:#f3e5f5; color:#7b1fa2; }
.tier-indicator.inactive { background:#ecf0f1; color:#7f8c8d; }

.empty-state {
  text-align:center; padding:24px; color:#aaa; font-size:0.9rem;
}

.timeline-item {
  padding:12px 0; border-left:3px solid var(--gold); padding-left:16px; margin-left:8px;
  margin-bottom:8px;
}
.timeline-date { font-size:0.8rem; color:#999; }
.timeline-event { font-size:0.9rem; font-weight:500; }

#loading {
  display:none; text-align:center; padding:60px;
  font-size:1.1rem; color:var(--navy);
}
#loading.active { display:block; }
.spinner {
  width:40px; height:40px; border:4px solid #f0f0f0;
  border-top:4px solid var(--gold); border-radius:50%;
  animation:spin 1s linear infinite; margin:0 auto 16px;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<nav class="topnav">
  <span class="brand">TPJG Contact 360</span>
  <div class="nav-links">
    <a href="#" onclick="showSearch()">Search</a>
    <a href="/home/aiciv/exports/icosa/index.html">Icosa</a>
  </div>
</nav>

<div id="searchSection" class="search-section">
  <h1>Contact 360 View</h1>
  <p>Unified view across CRM, texts, meetings, drive files, and email</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by name, phone, or email..."
           autocomplete="off" oninput="handleSearch(this.value)" onkeydown="handleSearchKey(event)">
    <button onclick="executeSearch()">Search</button>
  </div>
  <div class="search-stats" id="searchStats"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<div id="loading">
  <div class="spinner"></div>
  Loading contact data...
</div>

<div id="contactView" class="contact-view">
  <!-- Populated by JS -->
</div>

<script>
let peopleData = null;
let filteredResults = [];

// Load data
async function loadData() {
  document.getElementById('loading').classList.add('active');
  try {
    const resp = await fetch('./people-data.json');
    peopleData = await resp.json();
    document.getElementById('searchStats').textContent =
      `${peopleData.metadata.total_unique_people.toLocaleString()} contacts across ${peopleData.metadata.sources_used.join(', ')}`;
  } catch(e) {
    // Fallback: try loading from embedded data
    if (window.__PEOPLE_DATA) {
      peopleData = window.__PEOPLE_DATA;
    } else {
      document.getElementById('searchStats').textContent = 'Error loading data. Ensure people-data.json is in the same directory.';
    }
  }
  document.getElementById('loading').classList.remove('active');
}

function handleSearch(query) {
  if (!peopleData || query.length < 2) {
    document.getElementById('searchResults').classList.remove('active');
    return;
  }
  const q = query.toLowerCase().trim();
  const results = peopleData.people.filter(p => {
    return (p.name && p.name.toLowerCase().includes(q)) ||
           (p.phone_normalized && p.phone_normalized.includes(q.replace(/\D/g,''))) ||
           (p.email && p.email.toLowerCase().includes(q)) ||
           (p.phone && p.phone.includes(q));
  }).slice(0, 15);

  filteredResults = results;
  renderSearchResults(results);
}

function handleSearchKey(e) {
  if (e.key === 'Enter') executeSearch();
}

function executeSearch() {
  handleSearch(document.getElementById('searchInput').value);
}

function renderSearchResults(results) {
  const container = document.getElementById('searchResults');
  if (results.length === 0) {
    container.innerHTML = '<div style="padding:16px;text-align:center;color:#999;">No contacts found</div>';
    container.classList.add('active');
    return;
  }
  container.innerHTML = results.map((p, i) => `
    <div class="search-result-item" onclick="showContact(${i})">
      <div>
        <div class="name">${esc(p.name || 'Unknown')}</div>
        <div class="meta">${esc(p.phone || '')} ${p.email ? '| ' + esc(p.email) : ''}</div>
      </div>
      <div class="sources">
        ${p.sources.map(s => `<span class="source-badge ${s}">${s}</span>`).join('')}
      </div>
    </div>
  `).join('');
  container.classList.add('active');
}

function showContact(idx) {
  const p = filteredResults[idx];
  if (!p) return;
  document.getElementById('searchSection').style.display = 'none';
  document.getElementById('searchResults').classList.remove('active');
  const cv = document.getElementById('contactView');
  cv.classList.add('active');
  cv.innerHTML = buildContactView(p);
}

function showSearch() {
  document.getElementById('searchSection').style.display = '';
  document.getElementById('contactView').classList.remove('active');
  document.getElementById('contactView').innerHTML = '';
}

function getInitials(name) {
  if (!name) return '?';
  return name.split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
}

function getRankClass(rank) {
  if (!rank) return 'unranked';
  const r = rank.toUpperCase().replace('+','plus').replace('-','minus');
  if (r.includes('PLUS')) return 'a-plus';
  if (r === 'A') return 'a';
  if (r === 'B') return 'b';
  if (r === 'C') return 'c';
  return 'd';
}

function getTierClass(tier) {
  if (!tier) return 'inactive';
  return tier.toLowerCase();
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function buildContactView(p) {
  const initials = getInitials(p.name);
  const rankClass = getRankClass(p.crm_rank);
  const tierClass = getTierClass(p.relationship_tier);

  // Build topic bars
  const maxTopicCount = Math.max(...(p.text_top_topics||[]).map(t=>t.count), 1);
  const topicBars = (p.text_top_topics||[]).map(t => {
    const pct = Math.round((t.count / maxTopicCount) * 100);
    return `<div class="topic-bar">
      <span class="label">${esc(t.topic)}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%">${t.count}</div></div>
    </div>`;
  }).join('');

  // Build file list
  const files = (p.drive_files||[]).map(f => `
    <li>
      <span class="file-icon">&#128196;</span>
      <span class="file-cat">${esc(f.category||'file')}</span>
      ${esc(f.filename)}
    </li>
  `).join('');

  // Build meetings
  const meetings = (p.meeting_topics||[]).map(t => `
    <div class="meeting-item">
      <span class="meeting-topic">${esc(t)}</span>
    </div>
  `).join('');

  // Build groups/tags
  const groups = (p.crm_groups||[]).map(g => `<span class="tag">${esc(g)}</span>`).join('');

  // Build chat names
  const chats = (p.text_chat_names||[]).map(c => `<span class="tag">${esc(c)}</span>`).join('');

  // Timeline events
  let timeline = [];
  if (p.text_first_date) timeline.push({date: p.text_first_date, event: 'First text message'});
  if (p.text_last_date) timeline.push({date: p.text_last_date, event: 'Last text message'});
  timeline.sort((a,b) => a.date.localeCompare(b.date));
  const timelineHtml = timeline.map(t => `
    <div class="timeline-item">
      <div class="timeline-date">${esc(t.date)}</div>
      <div class="timeline-event">${esc(t.event)}</div>
    </div>
  `).join('');

  return `
    <div class="contact-header">
      <div class="contact-avatar">${initials}</div>
      <div class="contact-info">
        <h2>${esc(p.name || 'Unknown Contact')}</h2>
        <div class="subtitle">
          ${p.crm_rank ? `<span class="rank-badge ${rankClass}">${esc(p.crm_rank)}</span>` : ''}
          ${p.relationship_tier ? `<span class="tier-indicator ${tierClass}">${esc(p.relationship_tier)} contact</span>` : ''}
          <span style="margin-left:8px;color:#999;">ID: ${esc(p.person_id)}</span>
        </div>
        <div class="contact-meta">
          ${p.phone ? `<span class="contact-meta-item"><span class="icon">&#128222;</span> ${esc(p.phone)}</span>` : ''}
          ${p.email ? `<span class="contact-meta-item"><span class="icon">&#9993;</span> ${esc(p.email)}</span>` : ''}
          <span class="contact-meta-item"><span class="icon">&#128200;</span> ${(p.total_touchpoints||0).toLocaleString()} touchpoints</span>
        </div>
      </div>
      <button class="back-btn" onclick="showSearch()">&#8592; Back to Search</button>
    </div>

    <div class="grid-3">
      <div class="card">
        <h3><span class="icon">&#128172;</span> Text Messages</h3>
        <div class="stat-row"><span class="stat-label">Total Messages</span><span class="stat-value">${(p.text_count||0).toLocaleString()}</span></div>
        <div class="stat-row"><span class="stat-label">First Message</span><span class="stat-value">${esc(p.text_first_date||'N/A')}</span></div>
        <div class="stat-row"><span class="stat-label">Last Message</span><span class="stat-value">${esc(p.text_last_date||'N/A')}</span></div>
        ${chats ? `<div style="margin-top:12px;"><strong style="font-size:0.85rem;">Group Chats:</strong><div style="margin-top:4px;">${chats}</div></div>` : ''}
      </div>
      <div class="card">
        <h3><span class="icon">&#127891;</span> CRM Data</h3>
        <div class="stat-row"><span class="stat-label">Rank</span><span class="stat-value">${esc(p.crm_rank||'Unranked')}</span></div>
        <div class="stat-row"><span class="stat-label">Sources</span><span class="stat-value">${(p.sources||[]).join(', ')}</span></div>
        ${groups ? `<div style="margin-top:12px;"><strong style="font-size:0.85rem;">Groups:</strong><div style="margin-top:4px;">${groups}</div></div>` : ''}
      </div>
      <div class="card">
        <h3><span class="icon">&#127908;</span> Meetings</h3>
        <div class="stat-row"><span class="stat-label">Meeting Count</span><span class="stat-value">${p.meeting_count||0}</span></div>
        ${meetings || '<div class="empty-state">No meetings recorded</div>'}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3><span class="icon">&#128202;</span> Conversation Topics</h3>
        ${topicBars || '<div class="empty-state">No topic data</div>'}
      </div>
      <div class="card">
        <h3><span class="icon">&#128197;</span> Timeline</h3>
        ${timelineHtml || '<div class="empty-state">No timeline data</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3><span class="icon">&#128193;</span> Drive Files (${(p.drive_files||[]).length})</h3>
      ${files ? `<ul class="file-list">${files}</ul>` : '<div class="empty-state">No drive files linked</div>'}
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3><span class="icon">&#128203;</span> Data Sources</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${(p.sources||[]).map(s => `<span class="source-badge ${s}" style="font-size:0.85rem;padding:6px 14px;">${s.toUpperCase()}</span>`).join('')}
      </div>
      <div class="stat-row" style="margin-top:12px;"><span class="stat-label">Email Mentions</span><span class="stat-value">${p.email_mentions||0}</span></div>
      <div class="stat-row"><span class="stat-label">Drive Files</span><span class="stat-value">${p.drive_file_count||0}</span></div>
    </div>
  `;
}

// Initialize
document.addEventListener('DOMContentLoaded', loadData);

// Close search results on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box') && !e.target.closest('.search-results')) {
    document.getElementById('searchResults').classList.remove('active');
  }
});
</script>
</body>
</html>
